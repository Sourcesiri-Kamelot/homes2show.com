# Homes2Show AWS Native Architecture
# AI-Powered Real Estate Platform - AWS Account: 699475940746

project:
  name: homes2show
  domain: homes2show.com
  aws_account: "699475940746"
  owner_email: heloimai@helo-im.ai
  environment: production
  region: us-east-1

# DNS Configuration (ALREADY CONFIGURED ✅)
dns:
  route53:
    hosted_zone_id: ${AWS_ROUTE53_ZONE_ID}
    domain: homes2show.com
    status: LIVE_AND_CONFIGURED
    nameservers:
      - ns-852.awsdns-42.net
      - ns-2040.awsdns-63.co.uk
      - ns-206.awsdns-25.com
      - ns-1027.awsdns-00.org
    ttl: 172800
    records:
      - type: SOA
        value: "ns-852.awsdns-42.net. awsdns-hostmaster.amazon.com. 1 7200 900 1209600 86400"
        ttl: 900

# Frontend Architecture (AWS Native)
frontend:
  hosting:
    service: s3_static_website
    bucket_name: homes2show-frontend-prod
    region: us-east-1
    website_configuration:
      index_document: index.html
      error_document: error.html
    versioning: enabled
    encryption: AES256
    
  cdn:
    service: cloudfront
    distribution_config:
      origins:
        - domain_name: homes2show-frontend-prod.s3.amazonaws.com
          origin_id: S3-homes2show-frontend
          s3_origin_config:
            origin_access_identity: ${CLOUDFRONT_OAI}
      default_cache_behavior:
        target_origin_id: S3-homes2show-frontend
        viewer_protocol_policy: redirect-to-https
        compress: true
        cache_policy: Managed-CachingOptimized
      aliases:
        - homes2show.com
        - www.homes2show.com
      ssl_certificate:
        acm_certificate_arn: ${ACM_CERTIFICATE_ARN}
        ssl_support_method: sni-only
        minimum_protocol_version: TLSv1.2_2021
      price_class: PriceClass_100
      
  build_process:
    service: codebuild
    project_name: homes2show-frontend-build
    source:
      type: GITHUB
      location: https://github.com/${GITHUB_REPO}
    environment:
      compute_type: BUILD_GENERAL1_SMALL
      image: aws/codebuild/amazonlinux2-x86_64-standard:3.0
      type: LINUX_CONTAINER
    build_spec: |
      version: 0.2
      phases:
        pre_build:
          commands:
            - echo Logging in to Amazon ECR...
            - npm install
        build:
          commands:
            - echo Build started on `date`
            - npm run build
        post_build:
          commands:
            - echo Build completed on `date`
            - aws s3 sync build/ s3://homes2show-frontend-prod --delete
            - aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"

# Backend Architecture (AWS Serverless)
backend:
  api_gateway:
    name: homes2show-api
    type: REST
    stage: prod
    cors_configuration:
      allow_origins:
        - https://homes2show.com
        - https://www.homes2show.com
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
    
  lambda_functions:
    ai_pricing_assistant:
      runtime: nodejs18.x
      handler: src/handlers/pricing.handler
      memory_size: 512
      timeout: 30
      environment_variables:
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        DYNAMODB_TABLE: homes2show-pricing-data
      iam_role: homes2show-lambda-execution-role
      
    feedback_processor:
      runtime: nodejs18.x
      handler: src/handlers/feedback.handler
      memory_size: 256
      timeout: 15
      environment_variables:
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        DYNAMODB_TABLE: homes2show-feedback-data
        
    market_insights:
      runtime: nodejs18.x
      handler: src/handlers/insights.handler
      memory_size: 1024
      timeout: 60
      environment_variables:
        DYNAMODB_TABLE: homes2show-market-data
        OPENAI_API_KEY: ${OPENAI_API_KEY}
      schedule_expression: rate(1 hour)
      
    user_management:
      runtime: nodejs18.x
      handler: src/handlers/users.handler
      memory_size: 256
      timeout: 30
      environment_variables:
        COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
        DYNAMODB_TABLE: homes2show-users

# Database Architecture (AWS DynamoDB + Firebase Hybrid)
database:
  dynamodb:
    tables:
      homes2show-users:
        partition_key: userId
        sort_key: null
        billing_mode: PAY_PER_REQUEST
        stream_specification:
          stream_enabled: true
          stream_view_type: NEW_AND_OLD_IMAGES
        global_secondary_indexes:
          - index_name: email-index
            partition_key: email
            projection_type: ALL
            
      homes2show-showing-requests:
        partition_key: requestId
        sort_key: createdAt
        billing_mode: PAY_PER_REQUEST
        global_secondary_indexes:
          - index_name: userId-index
            partition_key: userId
            sort_key: createdAt
            projection_type: ALL
            
      homes2show-pricing-data:
        partition_key: propertyId
        sort_key: timestamp
        billing_mode: PAY_PER_REQUEST
        ttl_attribute: expiresAt
        
      homes2show-market-data:
        partition_key: region
        sort_key: timestamp
        billing_mode: PAY_PER_REQUEST
        
  firebase_integration:
    project_id: homes2show-prod
    use_cases:
      - real_time_messaging
      - file_uploads
      - push_notifications
    firestore_collections:
      - messages
      - notifications
      - real_time_updates

# Authentication (AWS Cognito + Firebase Auth)
authentication:
  cognito:
    user_pool:
      name: homes2show-users
      policies:
        password_policy:
          minimum_length: 8
          require_uppercase: true
          require_lowercase: true
          require_numbers: true
          require_symbols: true
      auto_verified_attributes:
        - email
      username_attributes:
        - email
      mfa_configuration: OPTIONAL
      
    user_pool_client:
      name: homes2show-web-client
      generate_secret: false
      supported_identity_providers:
        - COGNITO
        - Google
        - Facebook
      callback_urls:
        - https://homes2show.com/auth/callback
      logout_urls:
        - https://homes2show.com/auth/logout
        
    identity_pool:
      name: homes2show-identity-pool
      allow_unauthenticated_identities: false
      
  firebase_auth:
    integration: hybrid
    use_cases:
      - social_authentication
      - real_time_presence
      - custom_claims

# Storage (AWS S3)
storage:
  buckets:
    homes2show-assets:
      purpose: user_uploads_and_assets
      versioning: enabled
      encryption: AES256
      lifecycle_rules:
        - transition_to_ia: 30_days
        - transition_to_glacier: 90_days
        - expiration: 365_days
      cors_configuration:
        allowed_origins:
          - https://homes2show.com
        allowed_methods:
          - GET
          - PUT
          - POST
        allowed_headers:
          - "*"
          
    homes2show-backups:
      purpose: database_and_system_backups
      versioning: enabled
      encryption: KMS
      lifecycle_rules:
        - transition_to_glacier: 7_days
        - expiration: 2555_days  # 7 years
        
    homes2show-logs:
      purpose: application_and_access_logs
      versioning: disabled
      encryption: AES256
      lifecycle_rules:
        - expiration: 90_days

# Monitoring & Logging (AWS CloudWatch)
monitoring:
  cloudwatch:
    log_groups:
      - name: /aws/lambda/homes2show-ai-pricing
        retention_days: 30
      - name: /aws/lambda/homes2show-feedback
        retention_days: 30
      - name: /aws/lambda/homes2show-insights
        retention_days: 30
      - name: /aws/apigateway/homes2show-api
        retention_days: 14
      - name: /aws/cloudfront/homes2show
        retention_days: 7
        
    alarms:
      - name: HighErrorRate
        metric_name: ErrorRate
        namespace: AWS/ApiGateway
        statistic: Average
        threshold: 5
        comparison_operator: GreaterThanThreshold
        evaluation_periods: 2
        alarm_actions:
          - ${SNS_ALERT_TOPIC_ARN}
          
      - name: HighLatency
        metric_name: Latency
        namespace: AWS/ApiGateway
        statistic: Average
        threshold: 2000
        comparison_operator: GreaterThanThreshold
        evaluation_periods: 2
        alarm_actions:
          - ${SNS_ALERT_TOPIC_ARN}
          
    dashboards:
      - name: Homes2Show-Platform-Overview
        widgets:
          - api_gateway_metrics
          - lambda_performance
          - dynamodb_metrics
          - cloudfront_metrics
          - user_analytics
          
  x_ray:
    tracing_config:
      mode: Active
    services:
      - api_gateway
      - lambda_functions
      - dynamodb

# Security (AWS IAM & Security Services)
security:
  iam:
    roles:
      homes2show-lambda-execution-role:
        assume_role_policy: lambda.amazonaws.com
        policies:
          - AWSLambdaBasicExecutionRole
          - DynamoDBFullAccess
          - S3ReadOnlyAccess
          - CloudWatchLogsFullAccess
          
      homes2show-cognito-role:
        assume_role_policy: cognito-identity.amazonaws.com
        policies:
          - DynamoDBReadOnlyAccess
          - S3GetObjectAccess
          
    policies:
      homes2show-api-policy:
        version: "2012-10-17"
        statement:
          - effect: Allow
            actions:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            resources:
              - arn:aws:dynamodb:us-east-1:699475940746:table/homes2show-*
              
  waf:
    web_acl:
      name: homes2show-waf
      scope: CLOUDFRONT
      rules:
        - name: AWSManagedRulesCommonRuleSet
          priority: 1
          override_action: none
        - name: AWSManagedRulesKnownBadInputsRuleSet
          priority: 2
          override_action: none
        - name: RateLimitRule
          priority: 3
          action: block
          rate_limit: 2000
          
  secrets_manager:
    secrets:
      - name: homes2show/openai-api-key
        description: OpenAI API key for AI features
        
      - name: homes2show/stripe-keys
        description: Stripe API keys for payment processing
        
      - name: homes2show/firebase-config
        description: Firebase configuration and service account

# CI/CD Pipeline (AWS CodePipeline)
cicd:
  codepipeline:
    name: homes2show-deployment-pipeline
    role_arn: ${CODEPIPELINE_SERVICE_ROLE_ARN}
    stages:
      - name: Source
        actions:
          - name: SourceAction
            action_type_id:
              category: Source
              owner: ThirdParty
              provider: GitHub
              version: "1"
            configuration:
              Owner: ${GITHUB_OWNER}
              Repo: ${GITHUB_REPO}
              Branch: main
              OAuthToken: ${GITHUB_TOKEN}
              
      - name: Build
        actions:
          - name: BuildAction
            action_type_id:
              category: Build
              owner: AWS
              provider: CodeBuild
              version: "1"
            configuration:
              ProjectName: homes2show-frontend-build
              
      - name: Deploy
        actions:
          - name: DeployAction
            action_type_id:
              category: Deploy
              owner: AWS
              provider: S3
              version: "1"
            configuration:
              BucketName: homes2show-frontend-prod
              Extract: true

# Cost Optimization
cost_optimization:
  budgets:
    - name: homes2show-monthly-budget
      budget_type: COST
      time_unit: MONTHLY
      budget_limit:
        amount: 500
        unit: USD
      cost_filters:
        service:
          - Amazon Simple Storage Service
          - Amazon CloudFront
          - AWS Lambda
          - Amazon DynamoDB
          - Amazon API Gateway
      notifications:
        - notification_type: ACTUAL
          comparison_operator: GREATER_THAN
          threshold: 80
          subscriber_email_addresses:
            - heloimai@helo-im.ai
            
  reserved_capacity:
    dynamodb:
      - table_name: homes2show-users
        read_capacity: 5
        write_capacity: 5
        
# Disaster Recovery
disaster_recovery:
  backup_strategy:
    dynamodb:
      point_in_time_recovery: enabled
      backup_retention_period: 35_days
      
    s3:
      cross_region_replication:
        destination_bucket: homes2show-dr-us-west-2
        destination_region: us-west-2
        
  recovery_objectives:
    rto: 4_hours
    rpo: 1_hour
    
# Environment Variables Template
environment_variables:
  production:
    AWS_REGION: us-east-1
    AWS_ACCOUNT_ID: "699475940746"
    DOMAIN: homes2show.com
    ENVIRONMENT: production
    
    # API Gateway
    API_GATEWAY_URL: https://api.homes2show.com
    
    # DynamoDB Tables
    USERS_TABLE: homes2show-users
    REQUESTS_TABLE: homes2show-showing-requests
    PRICING_TABLE: homes2show-pricing-data
    MARKET_TABLE: homes2show-market-data
    
    # Cognito
    COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
    COGNITO_IDENTITY_POOL_ID: ${COGNITO_IDENTITY_POOL_ID}
    
    # S3 Buckets
    ASSETS_BUCKET: homes2show-assets
    BACKUPS_BUCKET: homes2show-backups
    
    # External APIs (stored in Secrets Manager)
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}

# Tags for all resources
resource_tags:
  Project: Homes2Show
  Environment: Production
  Owner: heloimai@helo-im.ai
  CostCenter: Platform-Development
  Backup: Required
  Monitoring: Enabled
  AI-Platform: true
  Domain: homes2show.com
  Account: "699475940746"
