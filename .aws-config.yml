# Homes2Show AWS Configuration
# AI-Powered Real Estate Platform - AWS Best Practices

project:
  name: homes2show
  type: ai-platform
  environment: development
  region: us-east-1
  domain: homes2show.com

# AWS Services Configuration
services:
  # Route 53 - DNS Management
  route53:
    hosted_zone_id: ${AWS_ROUTE53_ZONE_ID}
    domain: homes2show.com
    subdomains:
      - api.homes2show.com
      - admin.homes2show.com
      - cdn.homes2show.com
    health_checks: true
    failover: enabled

  # CloudFront - CDN
  cloudfront:
    distribution_id: ${AWS_CLOUDFRONT_DISTRIBUTION_ID}
    origins:
      - domain: homes2show.vercel.app
        path_pattern: "/*"
        cache_behavior: optimized
      - domain: homes2show-assets.s3.amazonaws.com
        path_pattern: "/assets/*"
        cache_behavior: static
    ssl_certificate: aws_managed
    compression: enabled
    security_headers: enabled

  # S3 - Asset Storage
  s3:
    buckets:
      assets:
        name: homes2show-assets
        region: us-east-1
        versioning: enabled
        encryption: AES256
        public_access: restricted
        cors_enabled: true
        lifecycle_rules:
          - transition_to_ia: 30_days
          - transition_to_glacier: 90_days
          - expiration: 365_days
      backups:
        name: homes2show-backups
        region: us-east-1
        versioning: enabled
        encryption: KMS
        public_access: blocked
      logs:
        name: homes2show-logs
        region: us-east-1
        retention: 90_days
        encryption: AES256

  # CloudWatch - Monitoring
  cloudwatch:
    log_groups:
      - name: /aws/lambda/homes2show-api
        retention: 30_days
      - name: /aws/cloudfront/homes2show
        retention: 14_days
    alarms:
      - name: HighErrorRate
        metric: ErrorRate
        threshold: 5
        comparison: GreaterThanThreshold
        notification: ${AWS_SNS_ALERTS_TOPIC}
      - name: HighLatency
        metric: ResponseTime
        threshold: 2000
        comparison: GreaterThanThreshold
        notification: ${AWS_SNS_ALERTS_TOPIC}
    dashboards:
      - name: Homes2Show-Platform
        widgets:
          - performance_metrics
          - error_rates
          - user_analytics
          - ai_feature_usage

  # Lambda - Serverless Functions
  lambda:
    functions:
      ai_pricing_assistant:
        runtime: nodejs18.x
        memory: 512
        timeout: 30
        environment:
          OPENAI_API_KEY: ${REACT_APP_OPENAI_API_KEY}
          ENVIRONMENT: ${ENVIRONMENT}
        vpc_config: disabled
        dead_letter_queue: enabled
      
      feedback_processor:
        runtime: nodejs18.x
        memory: 256
        timeout: 15
        environment:
          OPENAI_API_KEY: ${REACT_APP_OPENAI_API_KEY}
        triggers:
          - type: api_gateway
            path: /api/feedback/process
            method: POST

      market_insights:
        runtime: nodejs18.x
        memory: 1024
        timeout: 60
        environment:
          DATABASE_URL: ${DATABASE_URL}
          OPENAI_API_KEY: ${REACT_APP_OPENAI_API_KEY}
        schedule: rate(1 hour)

  # API Gateway - REST API
  api_gateway:
    name: homes2show-api
    stage: dev
    cors_enabled: true
    throttling:
      rate_limit: 1000
      burst_limit: 2000
    authentication:
      - type: firebase_auth
        authorizer: firebase_custom_authorizer
    endpoints:
      - path: /api/pricing
        method: POST
        integration: lambda
        function: ai_pricing_assistant
      - path: /api/feedback
        method: POST
        integration: lambda
        function: feedback_processor
      - path: /api/insights
        method: GET
        integration: lambda
        function: market_insights

  # IAM - Security Policies
  iam:
    roles:
      lambda_execution:
        name: Homes2Show-Lambda-Execution
        policies:
          - AWSLambdaBasicExecutionRole
          - CloudWatchLogsFullAccess
          - S3ReadOnlyAccess
        custom_policies:
          - name: OpenAI-API-Access
            actions:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            resources: "*"
      
      s3_access:
        name: Homes2Show-S3-Access
        policies:
          - name: AssetsBucketAccess
            actions:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            resources:
              - arn:aws:s3:::homes2show-assets/*

    users:
      ci_cd:
        name: homes2show-ci-cd
        policies:
          - CloudFrontFullAccess
          - S3FullAccess
          - LambdaFullAccess
        access_keys: programmatic_only

  # SNS - Notifications
  sns:
    topics:
      alerts:
        name: homes2show-alerts
        subscriptions:
          - protocol: email
            endpoint: alerts@homes2show.com
      user_notifications:
        name: homes2show-user-notifications
        subscriptions:
          - protocol: sms
            endpoint: ${ADMIN_PHONE}

# Security Configuration
security:
  encryption:
    at_rest: enabled
    in_transit: enabled
    key_management: aws_kms
  
  access_control:
    principle: least_privilege
    mfa_required: true
    password_policy: strict
  
  monitoring:
    cloudtrail: enabled
    config: enabled
    guardduty: enabled
    security_hub: enabled
  
  compliance:
    gdpr: enabled
    ccpa: enabled
    sox: enabled

# Cost Optimization
cost_optimization:
  reserved_instances: enabled
  spot_instances: development_only
  auto_scaling: enabled
  lifecycle_policies: enabled
  
  budgets:
    monthly_limit: 500
    alerts:
      - threshold: 80
        notification: ${AWS_SNS_ALERTS_TOPIC}
      - threshold: 100
        notification: ${AWS_SNS_ALERTS_TOPIC}

# Disaster Recovery
disaster_recovery:
  backup_strategy:
    frequency: daily
    retention: 30_days
    cross_region: enabled
    automated: true
  
  recovery_objectives:
    rto: 4_hours  # Recovery Time Objective
    rpo: 1_hour   # Recovery Point Objective
  
  testing:
    frequency: quarterly
    automated_tests: enabled

# Environment-Specific Configurations
environments:
  development:
    instance_types: t3.micro
    auto_scaling: disabled
    monitoring: basic
    backup_frequency: weekly
  
  staging:
    instance_types: t3.small
    auto_scaling: enabled
    monitoring: detailed
    backup_frequency: daily
  
  production:
    instance_types: t3.medium
    auto_scaling: enabled
    monitoring: detailed
    backup_frequency: hourly
    multi_az: enabled
    cdn: enabled

# AI-Specific Configuration
ai_services:
  openai:
    rate_limiting: enabled
    cost_monitoring: enabled
    usage_alerts: enabled
    model_versions:
      - gpt-4-turbo-preview
      - gpt-3.5-turbo
  
  aws_ai:
    comprehend: enabled
    textract: enabled
    rekognition: enabled
    personalize: planned

# Monitoring & Alerting
monitoring:
  metrics:
    - name: api_response_time
      threshold: 2000ms
      action: alert
    - name: error_rate
      threshold: 5%
      action: alert_and_scale
    - name: ai_api_usage
      threshold: 80%_of_quota
      action: alert
  
  dashboards:
    - name: Platform Overview
      metrics:
        - user_activity
        - api_performance
        - ai_feature_usage
        - cost_tracking
    - name: AI Features
      metrics:
        - pricing_assistant_usage
        - feedback_processing_volume
        - market_insights_accuracy

# Deployment Pipeline
deployment:
  stages:
    - name: build
      actions:
        - npm_install
        - run_tests
        - security_scan
        - build_artifacts
    
    - name: deploy_staging
      actions:
        - deploy_to_s3
        - update_cloudfront
        - run_integration_tests
    
    - name: deploy_production
      actions:
        - manual_approval
        - deploy_to_s3
        - update_cloudfront
        - health_checks
        - rollback_on_failure

# Tags (for resource management)
tags:
  Project: Homes2Show
  Environment: ${ENVIRONMENT}
  Owner: AI-Development-Team
  CostCenter: Platform-Development
  Backup: Required
  Monitoring: Enabled
  AI-Platform: true
